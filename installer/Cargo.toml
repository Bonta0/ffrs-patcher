[package]
name = "ffrs_patcher_setup"
version = "1.5.0"
edition = "2021"
description = "Installer for FFRS Patcher (FINAL FANTASY RESONANCE mod)"
license = "MIT"

[[bin]]
name = "FFRS-Patcher"
path = "src/main.rs"

[[bin]]
name = "theme-dev"
path = "src/bin/theme-dev.rs"

[dependencies]
ab_glyph = "0.2"
anyhow = "1.0"
repak = { git = "https://github.com/trumank/repak.git" }
# retoc's own git dependencies (jmap, repak, ser-hex) are pinned in Cargo.lock to the
# commits of its v0.1.5 release: jmap's main branch no longer fits it, so don't
# `cargo update` them
retoc = { git = "https://github.com/trumank/retoc.git", tag = "v0.1.5" }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Oodle decoding without Oodle's DLL (oodle_loader/src/lib.rs)
[patch."https://github.com/trumank/repak.git"]
oodle_loader = { path = "oodle_loader" }

[build-dependencies]
embed-manifest = "1.4"

[profile.release]
opt-level = "s"
lto = true
strip = true
